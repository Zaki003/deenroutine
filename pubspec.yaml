name: deenroutine
description: "DeenRoutine - Habits and Spirituality Productivity Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3

  # State management
  provider: ^6.1.2

  # Prayer time integration (Aladhan API)
  http: ^1.2.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.3

  # Local notifications (FR-08)
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
